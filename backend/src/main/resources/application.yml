spring:
  application:
    name: hhsp-email

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hhsp_email}
    username: ${DB_USERNAME:hhsp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  internal-secret: ${INTERNAL_SECRET:dev-internal-secret}
  tracking-base-url: ${TRACKING_BASE_URL:https://track.hhsp.dev}
  nas-mount-path: ${NAS_MOUNT_PATH:/mnt/nas/emails}
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000  # 24 hours

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

rate-limit:
  requests-per-minute: 100

logging:
  level:
    dev.hhsp: DEBUG
    org.springframework.security: INFO
