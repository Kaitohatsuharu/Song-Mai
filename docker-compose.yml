version: "3.9"

# Local development environment for HHSP Email SaaS
# Provides PostgreSQL and Redis only — app services run natively (Maven/npm)

services:

  postgres:
    image: postgres:16-alpine
    container_name: hhsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       hhsp_email
      POSTGRES_USER:     hhsp
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhsp -d hhsp_email"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hhsp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Adminer for DB inspection during development
  adminer:
    image: adminer:latest
    container_name: hhsp-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev-tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
