# Nginx configuration for HHSP Email
# Reverse proxy for API, Dashboard, and Tracking endpoints

# --- API (api.hhsp.dev → Spring Boot :8080) ---
server {
    listen 443 ssl http2;
    server_name api.hhsp.dev;

    ssl_certificate     /etc/letsencrypt/live/api.hhsp.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hhsp.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limit zone (applied per $binary_remote_addr)
    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 10m;
    }
}

# --- Dashboard (app.hhsp.dev → Next.js :3000) ---
server {
    listen 443 ssl http2;
    server_name app.hhsp.dev;

    ssl_certificate     /etc/letsencrypt/live/app.hhsp.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hhsp.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- Open/Click Tracking (track.hhsp.dev → Spring Boot :8080/track) ---
server {
    listen 443 ssl http2;
    server_name track.hhsp.dev;

    ssl_certificate     /etc/letsencrypt/live/track.hhsp.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.hhsp.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
}

# --- HTTP → HTTPS redirects ---
server {
    listen 80;
    server_name api.hhsp.dev app.hhsp.dev track.hhsp.dev;
    return 301 https://$host$request_uri;
}

# --- Rate limiting zone definition (add to nginx.conf http block) ---
